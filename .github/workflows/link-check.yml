name: Link check

# Weekly dead-link sweep over the README. Opens (or updates) a single issue
# when something breaks. Never edits the list itself.

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          # --max-concurrency keeps us under GitHub's rate limit on a 350-entry list.
          args: >-
            --no-progress
            --max-concurrency 8
            --max-retries 2
            --timeout 30
            --accept 200,206,429
            --exclude '^https://twitter\.com'
            --exclude '^https://x\.com'
            --exclude '^https://discord\.gg'
            README.md CONTRIBUTING.md
          output: ./lychee/out.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open or update the dead-link issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 Dead links found in the weekly sweep"
          content-filepath: ./lychee/out.md
          labels: broken-entry, automated

      # Advisory only. A 200 from a renamed or archived repo is not a healthy entry,
      # and lychee cannot tell the difference. Never fails the job.
      - name: Entry health (advisory)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/entry-health.mjs README.md CONTRIBUTING.md || true
          if [ -f entry-health-report.md ]; then
            echo "## Entry health (advisory)" >> "$GITHUB_STEP_SUMMARY"
            cat entry-health-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report clean run
        if: steps.lychee.outputs.exit_code == 0
        run: echo "All links resolved."
